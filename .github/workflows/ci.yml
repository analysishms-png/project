name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: analysis_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pdo, mysql, bcmath, gd, imagick, intl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Prepare environment
        run: |
          cp .env.example .env || echo "
          APP_NAME=Laravel
          APP_ENV=testing
          APP_KEY=base64:$(php -r 'echo bin2hex(random_bytes(32));')
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=analysis_testing
          DB_USERNAME=root
          DB_PASSWORD=root
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          " > .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Check PHP syntax (all controllers)
        run: |
          echo "Checking PHP syntax..."
          find app/Http/Controllers -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors"
          find app/Exports -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors"
          find routes -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors"
          echo "✅ All PHP files pass syntax check"

      - name: Run tests
        run: php artisan test --parallel --no-coverage

      - name: Verify routes
        run: php artisan route:list --columns=method,uri,name 2>/dev/null | head -50

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check for debug code
        run: |
          echo "Checking for debug code in controllers..."
          grep -rn "dd(\|dump(\|var_dump(\|print_r(" app/Http/Controllers/ --include="*.php" | grep -v "//\|/\*\|test\|Test" || echo "✅ No debug code found"

      - name: Check for hardcoded credentials
        run: |
          echo "Checking for hardcoded credentials..."
          grep -rn "password.*=.*['\"]" app/Http/Controllers/ --include="*.php" | grep -v "//\|/\*\|request\|->\|password_\|old_\|new_\|confirm_\|Hash\|bcrypt\|encrypt\|Auth\|config\|env" | head -5 || echo "✅ No hardcoded credentials found"

      - name: Check for unescaped output
        run: |
          echo "Checking for XSS in blade views..."
          grep -rn "{!!" resources/views/ --include="*.blade.php" | grep -v "csrf\|method\|slot\|trans\|__\|choice\|json\|e(" | head -10 || echo "✅ No unescaped output found"

      - name: Verify documentation
        run: |
          echo "Checking .ai documentation..."
          for f in .ai/BUG_REGISTER.md .ai/MODULE_STATUS.md .ai/NEXT_TASK.md .ai/CHANGELOG_AI.md; do
            if [ -f "$f" ]; then
              lines=$(wc -l < "$f")
              echo "  ✅ $f ($lines lines)"
            else
              echo "  ❌ $f MISSING"
            fi
          done
